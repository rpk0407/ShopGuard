version: '3.8'

# =============================================================================
# Quantitative Trading Platform - Docker Compose Configuration
# =============================================================================
# Start with: docker-compose up -d
# Stop with: docker-compose down
# View logs: docker-compose logs -f

services:
  # ---------------------------------------------------------------------------
  # Main Trading Application
  # ---------------------------------------------------------------------------
  trading-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopguard-trading
    restart: unless-stopped
    ports:
      - "5000:5000"  # Web dashboard
      - "8000:8000"  # API server
    environment:
      - TRADING_MODE=${TRADING_MODE:-paper}
      - DEFAULT_BROKER=${DEFAULT_BROKER:-paper}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-100000}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=quant_research
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      - postgres
      - redis
    networks:
      - trading-network

  # ---------------------------------------------------------------------------
  # Web Dashboard (Flask)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopguard-dashboard
    restart: unless-stopped
    command: python webapp/app.py
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=webapp/app.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
    depends_on:
      - postgres
      - redis
    networks:
      - trading-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (TimescaleDB for time-series data)
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shopguard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=quant_research
      - POSTGRES_USER=${POSTGRES_USER:-trader}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS="-E UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - trading-network

  # ---------------------------------------------------------------------------
  # Redis (Caching & Message Queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shopguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - trading-network

  # ---------------------------------------------------------------------------
  # Jupyter Lab (Research & Analysis)
  # ---------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopguard-jupyter
    restart: unless-stopped
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - trading-network

  # ---------------------------------------------------------------------------
  # Monitoring (Prometheus + Grafana) - Optional
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: shopguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - trading-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: shopguard-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - trading-network
    profiles:
      - monitoring

# =============================================================================
# Networks
# =============================================================================
networks:
  trading-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
