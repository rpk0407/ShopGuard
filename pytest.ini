[pytest]
# Pytest Configuration for Quantitative Trading Platform

python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

# Minimum version
minversion = 7.0

# Add src to Python path
pythonpath = src

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    fast: Fast running tests
    models: Mathematical model tests
    ai: AI/ML model tests
    execution: Execution and trading tests
    risk: Risk management tests
    data: Data pipeline tests
    requires_api: Tests that require API keys

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for long-running tests
timeout = 300

# Parallel execution
# Run with: pytest -n auto
